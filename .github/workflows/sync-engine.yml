name: sync-engine

# No secrets: the sync runs entirely on the repo's own GITHUB_TOKEN.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Track the latest engine release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump to the latest engine release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          engine=$(gh api repos/WhiteBite/repo-aeo/releases/latest --jq .tag_name)
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -v '^v[0-9]*$' | head -1)
          echo "engine=$engine tracked=$latest"
          if [ "$engine" = "$latest" ]; then
            echo "Already tracking $engine."
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$engine" "$latest" | sort -V | head -1)" != "$latest" ]; then
            echo "Engine tag $engine is not newer than $latest; skipping."
            exit 0
          fi
          version="${engine#v}"
          caret="^$version"
          sed -i "s|repo-aeo@\^[0-9][0-9.]*|repo-aeo@$caret|g" action.yml README.md README.ru.md
          sed -i "s|rdk-discoverability@v[0-9][0-9.]*|rdk-discoverability@$engine|g" README.md README.ru.md
          git config user.name "rdk-sync"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "chore: track the repo-aeo $engine engine release"
          git tag "$engine"
          major="v${version%%.*}"
          git tag -f "$major"
          git push origin main "$engine"
          git push --force origin "$major"
          echo "Now tracking $engine; $major points at the same commit."
